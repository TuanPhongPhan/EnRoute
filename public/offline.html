<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14b8a6" />
    <title>EnRoute is offline</title>
    <style>
      body {
        margin: 0;
        background: #f7fafc;
        color: #0f172a;
        font-family: Arial, sans-serif;
      }
      .card {
        max-width: 34rem;
        margin: 18vh auto;
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.1;
        margin: 1rem 0;
      }
      p {
        color: #475569;
        font-size: 1rem;
        line-height: 1.6;
      }
      .mark {
        display: block;
        width: 2.5rem;
        height: 2.5rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg aria-hidden="true" class="mark" fill="none" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="60" height="60" rx="18" fill="#14B8A6" />
        <path d="M20 16V48M20 16H44M20 32H37M20 48H44" stroke="white" stroke-width="6" stroke-linecap="round" />
        <circle cx="44" cy="16" r="5" fill="#FF6B57" stroke="white" stroke-width="2.5" />
      </svg>
      <h1>You’re offline.</h1>
      <p>EnRoute can’t refresh live information right now. Reconnect to continue planning your journey.</p>
    </main>
  </body>
</html>
